[package]
name = "somedrive"
version = "0.4.3"
description = "Linux-first desktop client for Microsoft OneDrive"
authors = ["Jack Brumley"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "somedrive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = "0.4"
dirs = "5.0"
arboard = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
futures-util = "0.3"
bytes = "1"
notify = { version = "8", default-features = false }
tokio = { version = "1", features = ["sync", "time", "macros", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
trash = "5"
unicode-normalization = "0.1"
globset = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# GTK prgname = Wayland app_id; must be set before any GTK use (platform::linux).
gtk = "0.18"
# The tray is a StatusNotifierItem (ksni): Tauri's Linux tray (libappindicator)
# reports no clicks. zbus checks for a StatusNotifier watcher.
ksni = { version = "0.3.7", default-features = false, features = ["tokio"] }
zbus = "5"

[target.'cfg(unix)'.dependencies]
# setsid() detaches the in-app updater from the app's session.
libc = "0.2"

# Dev builds are optimized too: unoptimized SQLite, TLS and file hashing are
# several times slower and made dev sync speeds unrepresentative. The
# dependencies (built once) get full optimization; SomeDrive's own code a
# light level, which keeps rebuilds quick but makes hashing fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
