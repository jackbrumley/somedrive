# Checks SomeDrive on every push and pull request to dev and main (App
# Standard section 7). SomeDrive ships for Linux only, so everything runs on
# Linux. Installers are built only by release.yml.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (typecheck, lint, structure checks, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:structure
      - run: npm run check:sync-status-writes
      - run: npm run check:ui-data-reads
      - run: npm run build

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      # Installs the version (and components) pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # The WebKitGTK set from the release Containerfile, plus libdbus (tao).
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libgtk-3-dev librsvg2-dev libwebkit2gtk-4.1-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! embeds the built frontend (frontendDist).
      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Check installer script syntax
        run: |
          for script in docs/install.sh docs/uninstall.sh; do
            bash -n "$script"
          done
